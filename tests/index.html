<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tests</title>
  <style>
    body { font-family: ui-monospace, Menlo, monospace; font-size: 14px; padding: 16px; background: #fff; color: #1c2430; }
    .ok { color: #1a9e55; }
    .fail { color: #d1383d; font-weight: bold; }
  </style>
</head>
<body>
  <h1 id="summary">Running tests…</h1>
  <div id="results"></div>

  <script src="../csv.js"></script>
  <script src="../importer.js"></script>
  <script src="tests.js"></script>
  <script>
    // Show each test result, failures in red
    const lines = runTests();
    const failed = lines.filter((l) => l.startsWith("FAIL")).length;
    document.getElementById("summary").textContent =
      failed ? failed + " of " + lines.length + " tests FAILED" : "All " + lines.length + " tests passed";
    lines.forEach((line) => {
      const div = document.createElement("div");
      div.className = line.startsWith("FAIL") ? "fail" : "ok";
      div.textContent = line;
      document.getElementById("results").append(div);
    });
  </script>
</body>
</html>
